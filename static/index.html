<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training Volume Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h1 { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }

    .year-bar {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 24px;
      display: flex;
      gap: 6px;
      min-height: 44px;
    }

    .sync-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .sync-btn:hover { background: #1d4ed8; }
    .sync-btn:disabled { background: #93c5fd; cursor: not-allowed; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
    }

    .btn-group { display: flex; gap: 6px; }

    .pill {
      border: 1.5px solid #d1d5db;
      background: transparent;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #6b7280;
      transition: all 0.12s;
    }
    .pill:hover { border-color: #2563eb; color: #2563eb; }
    .pill.active { background: #2563eb; border-color: #2563eb; color: #fff; }

    .list {
      padding: 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .week-block { border-bottom: 1px solid #f0f0f0; }
    .week-block:last-child { border-bottom: none; }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 0;
      cursor: pointer;
    }
    .row:hover .week { color: #2563eb; }

    .toggle {
      flex-shrink: 0;
      width: 12px;
      font-size: 0.7rem;
      color: #9ca3af;
      display: inline-block;
      transition: transform 0.18s;
      user-select: none;
    }
    .toggle.open { transform: rotate(90deg); }

    .detail {
      display: none;
      background: #fafafa;
      padding: 0 0 10px 24px;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .detail-table th {
      text-align: left;
      padding: 5px 10px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #9ca3af;
      border-bottom: 1px solid #e5e7eb;
    }
    .detail-table td {
      padding: 6px 10px;
      color: #374151;
      border-bottom: 1px solid #f3f4f6;
    }
    .detail-table tr:last-child td { border-bottom: none; }
    .detail-table tbody tr:hover td { background: #f0f4ff; }
    .detail-table th:nth-child(5),
    .detail-table td:nth-child(5),
    .detail-table th:last-child,
    .detail-table td:last-child { text-align: right; }
    .detail-loading { padding: 10px; font-size: 0.8rem; color: #9ca3af; }

    .week {
      width: 100px;
      flex-shrink: 0;
      font-size: 0.8rem;
      color: #6b7280;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .val {
      width: 82px;
      flex-shrink: 0;
      text-align: right;
      font-size: 0.875rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .bar-wrap {
      flex: 1;
      height: 14px;
      background: #e9ecef;
      border-radius: 7px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #16a34a;
      border-radius: 7px;
      transition: width 0.35s ease;
    }

    .status {
      padding: 6px 24px 12px;
      font-size: 0.75rem;
      color: #9ca3af;
      min-height: 28px;
    }
    .status.error { color: #dc2626; }

    .summary {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      gap: 32px;
    }

    .stat-val {
      display: block;
      font-size: 1.5rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .stat-label {
      display: block;
      font-size: 0.72rem;
      color: #9ca3af;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .overlay.visible { display: flex; }

    .modal {
      background: #fff;
      border-radius: 10px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .modal h2  { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
    .modal p   { font-size: 0.8rem; color: #6b7280; margin-bottom: 20px; }
    .modal a   { color: #2563eb; text-decoration: none; }
    .modal a:hover { text-decoration: underline; }

    .modal input[type=text] {
      width: 100%;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 0.875rem;
      outline: none;
      font-family: monospace;
      margin-bottom: 16px;
    }
    .modal input[type=text]:focus { border-color: #2563eb; }

    .modal-footer { display: flex; justify-content: flex-end; }

    .modal-err {
      font-size: 0.75rem;
      color: #dc2626;
      margin-bottom: 10px;
      min-height: 1em;
    }

    .empty {
      padding: 48px 0;
      text-align: center;
      color: #9ca3af;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Garmin Personal API Key</h2>
    <p>Enter your API key from <a href="https://connect.garmin.com/app/settings/personalApiToken" target="_blank">Garmin Connect</a>.<br>It will be kept in memory for this session.</p>
    <input type="text" id="keyInput" placeholder="Paste your API key here" autocomplete="off" spellcheck="false">
    <div class="modal-err" id="keyErr"></div>
    <div class="modal-footer">
      <button class="sync-btn" onclick="saveKey()">Save</button>
    </div>
  </div>
</div>

<header>
  <h1>Training Volume</h1>
  <button class="sync-btn" id="syncBtn" onclick="sync()">Sync</button>
</header>

<div class="year-bar" id="yearBar"></div>

<div class="controls">
  <div class="btn-group">
    <button class="pill active" id="btn-all"     onclick="setFilter('all')">All</button>
    <button class="pill"        id="btn-running" onclick="setFilter('running')">Running</button>
    <button class="pill"        id="btn-cycling" onclick="setFilter('cycling')">Biking</button>
  </div>
  <div class="btn-group">
    <button class="pill active" id="metric-km"    onclick="setMetric('km')">Distance</button>
    <button class="pill"        id="metric-hours" onclick="setMetric('hours')">Time</button>
  </div>
</div>

<div class="summary">
  <div>
    <span class="stat-val" id="totalVal">—</span>
    <span class="stat-label" id="totalLabel">total</span>
  </div>
  <div>
    <span class="stat-val" id="totalWeeks">—</span>
    <span class="stat-label">active weeks</span>
  </div>
</div>

<div class="list" id="rows"></div>
<div class="status" id="status"></div>

<script>
  async function checkKey() {
    const res = await fetch('/api/status');
    const { key_set } = await res.json();
    if (!key_set) {
      document.getElementById('overlay').classList.add('visible');
      document.getElementById('keyInput').focus();
    }
  }

  async function saveKey() {
    const key = document.getElementById('keyInput').value.trim();
    if (!key) { document.getElementById('keyErr').textContent = 'Please enter a key.'; return; }
    document.getElementById('keyErr').textContent = '';
    const res = await fetch('/api/key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key }),
    });
    if (!res.ok) {
      document.getElementById('keyErr').textContent = 'Failed to save key.';
      return;
    }
    document.getElementById('overlay').classList.remove('visible');
    document.getElementById('keyInput').value = '';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('overlay').classList.contains('visible')) saveKey();
  });

  let allData = [];
  let currentFilter = 'all';
  let currentMetric = 'km';
  let currentYear = String(new Date().getFullYear());
  let expandedWeek = null;

  // Convert ISO week string "2026-W45" to its Monday date.
  function isoWeekMonday(isoWeek) {
    const [year, week] = isoWeek.split('-W').map(Number);
    const d = new Date(year, 0, 4); // Jan 4 is always in week 1
    d.setDate(d.getDate() - (d.getDay() || 7) + 1 + (week - 1) * 7);
    return d;
  }

  function fmtWeek(isoWeek) {
    const d = isoWeekMonday(isoWeek);
    return d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
  }

  function fmtKm(km) {
    return (km > 100 ? Math.round(km) : km.toFixed(1)) + ' km';
  }

  function fmtValue(row) {
    if (currentMetric === 'km') return fmtKm(row.km);
    const totalMin = Math.round(row.hours * 60);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return h > 0 ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`;
  }

  function getValue(row) {
    return currentMetric === 'km' ? row.km : row.hours;
  }

  function buildYearButtons(years) {
    document.getElementById('yearBar').innerHTML = years.map(y =>
      `<button class="pill ${y === currentYear ? 'active' : ''}" onclick="setYear('${y}')">${y}</button>`
    ).join('');
  }

  function setYear(y) {
    currentYear = y;
    document.querySelectorAll('#yearBar .pill').forEach(btn =>
      btn.classList.toggle('active', btn.textContent === y));
    render();
  }

  function fmtTotal(data) {
    if (currentMetric === 'km') {
      return fmtKm(data.reduce((s, r) => s + r.km, 0));
    }
    const totalHours = data.reduce((s, r) => s + r.hours, 0);
    const h = Math.floor(totalHours);
    const m = Math.round((totalHours - h) * 60);
    return `${h}:${String(m).padStart(2, '0')}`;
  }

  const sportNames = {
    running:                        'Running',
    cycling:                        'Cycling',
    kiteboarding_v2:                'Kiting',
    lap_swimming:                   'Swimming',
    walking:                        'Walking',
    resort_snowboarding:            'Snowboarding',
    resort_skiing_snowboarding_ws:  'Skiing',
    wind_kite_surfing:              'Kiting',
    hiking:                         'Hiking',
    sailing_v2:                     'Sailing',
    trail_running:                  'Running',
  };

  function prettifySport(typeKey) {
    if (!typeKey) return '—';
    return sportNames[typeKey]
      ?? typeKey.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  }

  function fmtActivityDate(startedAt) {
    return new Date(startedAt).toLocaleDateString('en-US', { month: 'short', day: '2-digit' });
  }

  function fmtDuration(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.round((seconds % 3600) / 60);
    return h > 0 ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`;
  }

  function fmtDetailDuration(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.round((seconds % 3600) / 60);
    return `${h}:${String(m).padStart(2, '0')}`;
  }

  function fmtPace(durationS, km) {
    if (km <= 0) return '—';
    const paceMin = (durationS / 60) / km;
    const m = Math.floor(paceMin);
    const s = Math.round((paceMin - m) * 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  async function toggleDetail(isoWeek) {
    const detail = document.getElementById('detail-' + isoWeek);
    const toggle = document.getElementById('toggle-' + isoWeek);

    if (expandedWeek === isoWeek) {
      detail.style.display = 'none';
      toggle.classList.remove('open');
      expandedWeek = null;
      return;
    }
    if (expandedWeek) {
      document.getElementById('detail-' + expandedWeek).style.display = 'none';
      document.getElementById('toggle-' + expandedWeek).classList.remove('open');
    }
    expandedWeek = isoWeek;
    toggle.classList.add('open');
    detail.style.display = 'block';
    detail.innerHTML = '<div class="detail-loading">Loading…</div>';

    const res = await fetch(`/api/activities?week=${isoWeek}&sport=${currentFilter}`);
    const acts = await res.json();

    if (!acts.length) {
      detail.innerHTML = '<div class="detail-loading">No activities.</div>';
      return;
    }
    detail.innerHTML = `<table class="detail-table">
      <thead><tr><th>Date</th><th>Sport</th><th>Name</th><th>Duration</th><th>Distance</th><th>Pace</th><th>Avg HR</th><th>Max HR</th></tr></thead>
      <tbody>${acts.map(a => `<tr>
        <td>${fmtActivityDate(a.started_at)}</td>
        <td>${prettifySport(a.type_key)}</td>
        <td>${a.name || '—'}</td>
        <td>${fmtDetailDuration(a.duration_s)}</td>
        <td>${a.km.toFixed(1)} km</td>
        <td>${fmtPace(a.duration_s, a.km)}</td>
        <td>${a.avg_hr > 0 ? a.avg_hr : '—'}</td>
        <td>${a.max_hr > 0 ? a.max_hr : '—'}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  }

  function render() {
    const data = allData.filter(r => r.week.startsWith(currentYear + '-'));
    const container = document.getElementById('rows');
    expandedWeek = null;

    document.getElementById('totalVal').textContent   = data.length ? fmtTotal(data) : '—';
    document.getElementById('totalLabel').textContent = currentMetric === 'km' ? 'total distance' : 'total time';
    document.getElementById('totalWeeks').textContent = data.length ? data.length : '—';

    if (!allData.length) {
      container.innerHTML = '<div class="empty">No activities — click Sync to load.</div>';
      return;
    }
    if (!data.length) {
      container.innerHTML = '<div class="empty">No activities for ' + currentYear + '.</div>';
      return;
    }
    const max = Math.max(...data.map(getValue));
    container.innerHTML = data.map(row => {
      const pct = max > 0 ? (getValue(row) / max * 100).toFixed(1) : 0;
      return `<div class="week-block">
        <div class="row" onclick="toggleDetail('${row.week}')">
          <span class="toggle" id="toggle-${row.week}">›</span>
          <span class="week">${fmtWeek(row.week)}</span>
          <span class="val">${fmtValue(row)}</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="detail" id="detail-${row.week}"></div>
      </div>`;
    }).join('');
  }

  function setFilter(f) {
    currentFilter = f;
    ['all', 'running', 'cycling'].forEach(s =>
      document.getElementById('btn-' + s).classList.toggle('active', s === f));
    fetchData();
  }

  function setMetric(m) {
    currentMetric = m;
    ['km', 'hours'].forEach(s =>
      document.getElementById('metric-' + s).classList.toggle('active', s === m));
    render();
  }

  async function fetchData() {
    try {
      const res = await fetch('/api/weeks?sport=' + currentFilter);
      allData = await res.json();

      const years = [...new Set(allData.map(r => r.week.split('-W')[0]))].sort().reverse();
      if (years.length && !years.includes(currentYear)) currentYear = years[0];
      buildYearButtons(years);

      render();
    } catch (e) {
      setStatus('Failed to load: ' + e.message, true);
    }
  }

  async function sync() {
    const btn = document.getElementById('syncBtn');
    btn.disabled = true;
    setStatus('Syncing…');
    try {
      const res = await fetch('/api/sync');
      const d = await res.json();
      if (d.error) {
        setStatus(d.error, true);
      } else {
        setStatus(`Synced ${d.synced} new activit${d.synced === 1 ? 'y' : 'ies'}.`);
        await fetchData();
      }
    } catch (e) {
      setStatus('Sync failed: ' + e.message, true);
    } finally {
      btn.disabled = false;
    }
  }

  function setStatus(msg, err) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status' + (err ? ' error' : '');
  }

  checkKey();
  fetchData();
</script>
</body>
</html>
